name: flow-input

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: flow-input:local
    container_name: flow-input-api
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      NS3_BUILD_JOBS: "2"
    volumes:
      - ns3-build:/workspace/build
      - ns3-cache:/workspace/cmake-cache
      - simulation-results:/workspace/examples/Reverie/dump
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      retries: 3

volumes:
  ns3-build:
  ns3-cache:
  simulation-results:
